<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8f4ef"><title>Criar conta — Amanda Beauty</title><link rel="stylesheet" href="styles.css"></head>
<body data-page="cadastro"><div id="site-header"></div><main class="auth-page wrap register-page"><div class="auth-image"><img src="assets/makeup-artista.jpeg" alt="Cliente recebendo maquiagem profissional"><div class="auth-image-copy"><span>✳</span><p>Cuide de você.<br>O resto a gente<br><em>celebra junto.</em></p></div></div><section class="auth-panel"><span class="eyebrow">seu espaço Amanda Beauty</span><h1>Vamos nos<br><em>conhecer?</em></h1><p class="auth-sub">Crie sua conta para deixar seu próximo momento mais pertinho.</p><form class="auth-form" id="register-form"><label for="register-name">Seu nome</label><input id="register-name" name="name" type="text" autocomplete="name" placeholder="Como podemos te chamar?" required minlength="2"><label for="register-email">E-mail</label><input id="register-email" name="email" type="email" autocomplete="email" placeholder="voce@email.com" required><label for="register-password">Crie uma senha</label><div class="password-wrap"><input id="register-password" name="password" type="password" autocomplete="new-password" placeholder="Pelo menos 6 caracteres" required minlength="6"><button type="button" class="password-toggle" aria-label="Mostrar senha">◉</button></div><label class="check-label terms-check"><input type="checkbox" required> <span>Concordo em receber novidades e aceito os termos de uso.</span></label><button class="button button-dark form-submit" type="submit">Criar minha conta <span>↗</span></button><div class="form-feedback" role="status" aria-live="polite"></div></form><p class="auth-switch">Já tem uma conta? <a href="login.html">Entrar</a></p><p class="demo-note">Demonstração visual · sem cadastro em servidor</p></section></main><div id="site-footer"></div><script src="app.js"></script></body></html>
